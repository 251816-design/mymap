<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 주변 공공시설 지도</title>

    <style>
        /* 전체 화면의 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        button {
            font: inherit;
        }

        /* 왼쪽 시설 목록과 오른쪽 지도를 나누는 영역 */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 370px;
            min-width: 300px;
            background: #fff;
            border-right: 1px solid #ddd;
            z-index: 1;
        }

        .header {
            padding: 22px 20px 16px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 현재 위치와 교통정보 기능 버튼 */
        .tool-buttons {
            display: flex;
            gap: 8px;
            padding: 0 20px 15px;
        }

        .tool-button {
            flex: 1;
            padding: 10px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 13px;
            cursor: pointer;
        }

        .tool-button:hover {
            background: #f7f7f7;
        }

        .tool-button.active {
            border-color: #e5bb00;
            background: #fff5b8;
        }

        .tool-button:disabled,
        .tab-button:disabled {
            color: #999;
            cursor: not-allowed;
        }

        /* 공공기관 / 문화시설 탭 */
        .tab-list {
            display: flex;
            gap: 8px;
            padding: 0 20px 14px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f8f8;
            color: #444;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
